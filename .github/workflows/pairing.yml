name: Telegram koppeln

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pairing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-momentum-single-writer
  cancel-in-progress: false

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PAIR_CODE: ${{ secrets.TELEGRAM_PAIR_CODE }}
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Code laden
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python vorbereiten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kopplung testen
        run: python -m unittest discover -s tests -v
      - name: Telegram koppeln
        run: python agent.py pair

