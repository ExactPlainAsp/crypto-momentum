name: Einrichtung prüfen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Code laden
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python vorbereiten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Filter und Budgetschutz testen
        run: python -m unittest discover -s tests -v
      - name: Einrichtung prüfen, ohne Schlüsselwerte auszugeben
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PAIR_CODE: ${{ secrets.TELEGRAM_PAIR_CODE }}
        run: |
          python - <<'PY'
          import os
          required = ['APIFY_TOKEN', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_PAIR_CODE']
          missing = []
          for name in required:
              valid = bool(os.environ.get(name, '').strip())
              if name == 'TELEGRAM_PAIR_CODE':
                  valid = len(os.environ.get(name, '').strip()) >= 20
              print(name + ': ' + ('bereit' if valid else 'fehlt oder ist zu kurz'))
              if not valid:
                  missing.append(name)
          if missing:
              print('Einrichtung unvollständig. Es wurde kein externer Datenabruf gestartet.')
          else:
              print('Alle drei Secrets sind gesetzt. Nächster Schritt: Momentum-Wächter mit Modus pair starten.')
          PY
