name: Momentum-Wächter

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pair: Telegram koppeln; check: Dienste testen; sample: X testen; activate: Beobachtung starten; observe: prüfen; signals: Beobachtungen senden"
        required: true
        type: choice
        default: check
        options: [pair, check, sample, activate, observe, signals]
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: crypto-momentum-single-writer
  cancel-in-progress: false

jobs:
  monitor:
    # Ongoing observation explicitly approved by the owner on 2026-10-31.
    # An explicit false remains an immediate pause control.
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PAIR_CODE: ${{ secrets.TELEGRAM_PAIR_CODE }}
      PORTFOLIO_CHF: ${{ secrets.PORTFOLIO_CHF }}
      MONITOR_ENABLED: ${{ vars.MONITOR_ENABLED || 'true' }}
      SIGNAL_ALERTS_ENABLED: 'false'
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Code laden
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python vorbereiten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Filter und Budgetschutz testen
        run: python -m unittest discover -s tests -v
      - name: Gewählten Modus ausführen
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python agent.py "$REQUESTED_MODE"
          elif [ "$SIGNAL_ALERTS_ENABLED" = "true" ]; then
            python agent.py signals
          else
            python agent.py observe
          fi
